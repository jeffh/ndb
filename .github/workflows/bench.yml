name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      benchtime:
        description: go test -benchtime
        required: false
        default: "1s"
      count:
        description: go test -count (benchstat-friendly repeats)
        required: false
        default: "6"
      large:
        description: Run 100MB+ benches (NDB_BENCH_LARGE=1)
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - "**/*.go"
      - "scripts/bench-compare.sh"
      - ".github/workflows/bench.yml"
      - "Makefile"

# Separate from the required Test/Build workflow. Not a required status check
# on main (repo ruleset has no required_status_checks). go test -bench does
# not compare timings, so performance noise cannot fail this job.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Benchmark (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # amd64 exercises the AVX2 scanners, arm64 the NEON ones.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run benchmarks
        env:
          BENCH_COUNT: ${{ inputs.count || '6' }}
          BENCH_TIME: ${{ inputs.benchtime || '1s' }}
          NDB_BENCH_LARGE: ${{ inputs.large && '1' || '' }}
        run: |
          set -euo pipefail
          mkdir -p tmp/bench
          header() {
            echo "# go=$(go env GOVERSION) $(go env GOOS)/$(go env GOARCH)"
            echo "# cpu=$(uname -p 2>/dev/null || true) $(nproc) cores"
            echo "# mem=$(awk '/MemTotal/ {print $2, $3}' /proc/meminfo)"
            lscpu | awk -F: '/Model name/ {gsub(/^[ \t]+/, "", $2); print "# model="$2; exit}'
          }
          header > tmp/bench/bench.txt
          header > tmp/bench/bench-simd.txt
          # Alternate default and GOEXPERIMENT=simd (archsimd scanners
          # compiled in) one count at a time so runner drift hits both.
          for _ in $(seq "$BENCH_COUNT"); do
            go test -run '^$' -bench . -benchmem -count=1 -benchtime="$BENCH_TIME" \
              | tee -a tmp/bench/bench.txt
            GOEXPERIMENT=simd go test -run '^$' -bench . -benchmem -count=1 -benchtime="$BENCH_TIME" \
              | tee -a tmp/bench/bench-simd.txt
          done

      - name: Compare default vs GOEXPERIMENT=simd
        run: |
          set -euo pipefail
          go run golang.org/x/perf/cmd/benchstat@v0.0.0-20250807204132-c4b8702907f0 \
            default=tmp/bench/bench.txt simd=tmp/bench/bench-simd.txt | tee tmp/bench/benchstat.txt

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Benchmark results (${{ matrix.runner }})"
            echo
            echo "This check is informational. It does not fail on performance noise."
            echo
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- Runner: \`${{ runner.os }}\` / \`${{ runner.arch }}\`"
            echo "- Go: \`$(go env GOVERSION)\`"
            echo
            echo '```'
            if [[ -f tmp/bench/bench.txt ]]; then
              cat tmp/bench/bench.txt
            else
              echo "(no bench output)"
            fi
            echo '```'
            echo
            echo "### benchstat: default vs GOEXPERIMENT=simd"
            echo
            echo '```'
            if [[ -f tmp/bench/benchstat.txt ]]; then
              cat tmp/bench/benchstat.txt
            else
              echo "(no benchstat output)"
            fi
            echo '```'
            echo
            echo "### GOEXPERIMENT=simd"
            echo
            echo '```'
            if [[ -f tmp/bench/bench-simd.txt ]]; then
              cat tmp/bench/bench-simd.txt
            else
              echo "(no bench output)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bench.txt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ matrix.runner }}
          path: tmp/bench/bench*.txt
          if-no-files-found: warn
